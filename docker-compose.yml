services:
  postgres:
    image: postgres:16-alpine
    container_name: jeevansync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jeevansync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jeevansync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jeevansync_internal

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jeevansync_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jeevansync}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_min_32_characters_long_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_min_32_characters_long_12345}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-01234567890123456789012345678901}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-mock_phone_number_id}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-mock_whatsapp_token}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-jeevansync_whatsapp_verify_token_2026}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-mock_meta_app_secret}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jeevansync_internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jeevansync_client
    restart: unless-stopped
    networks:
      - jeevansync_internal

  nginx:
    image: nginx:alpine
    container_name: jeevansync_proxy
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    networks:
      - jeevansync_internal

networks:
  jeevansync_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
