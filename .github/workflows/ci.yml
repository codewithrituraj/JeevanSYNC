name: JeevanSYNC CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Push SQLite Schema
        run: |
          cd server
          npx prisma generate
          npx prisma db push --schema=prisma/schema.sqlite.prisma
          node prisma/seed.js

      - name: Run Backend Integration Test Suite
        run: |
          cd server
          npm test

      - name: Run Dependency Vulnerability Audit
        run: |
          cd server
          npm audit --audit-level=high || true

  frontend-checks:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Vite Frontend
        run: |
          cd client
          npm run build
